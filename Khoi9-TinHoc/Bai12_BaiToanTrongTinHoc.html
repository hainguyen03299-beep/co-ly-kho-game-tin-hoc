<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NHANH HƠN - Thử thách Tin học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            overflow: hidden;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .particle {
            position: absolute;
            top: -5vh;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 0;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 2rem;
            z-index: 10;
        }

        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .answer-btn {
            text-align: left;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            margin-bottom: 0.75rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .answer-btn:hover {
            background-color: #f0fdf4;
            border-color: #4ade80;
        }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            transition: width 0.3s ease;
        }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Audio Elements -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-lofi-vibes-track-614.mp3" type="audio/mpeg">
    </audio>
    <audio id="correctSound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">
    </audio>
    <audio id="wrongSound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container" class="w-full max-w-2xl relative">
        
        <!-- Screen: Welcome -->
        <div id="screen-welcome" class="glass-card p-8 text-center fade-in">
            <div class="text-5xl mb-4">🎮</div>
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">AI NHANH HƠN ⚡</h1>
            <p class="text-gray-600 mb-8">Thử thách 20 câu hỏi ngẫu nhiên ôn luyện Bài 12!</p>
            
            <div class="mb-6">
                <input type="text" id="player-name" placeholder="Nhập họ và tên của em..." 
                    class="w-full p-4 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-lg text-center">
            </div>
            
            <button onclick="startGame()" class="bg-blue-600 text-white px-10 py-4 rounded-2xl text-xl font-bold btn-hover">
                BẮT ĐẦU CHƠI 🚀
            </button>
            <p class="mt-4 text-sm text-gray-400 italic">Lưu ý: Hãy nhập cả họ và tên của em.</p>
        </div>

        <!-- Screen: Quiz -->
        <div id="screen-quiz" class="glass-card p-6 hidden fade-in">
            <div class="flex justify-between items-center mb-4">
                <div class="flex flex-col">
                    <span id="display-name" class="font-bold text-blue-600 text-lg">Học sinh</span>
                    <span class="text-xs text-gray-500 uppercase tracking-widest">Đang ôn tập</span>
                </div>
                <div class="text-right">
                    <div id="timer" class="text-2xl font-mono font-bold text-blue-500">00:00</div>
                    <div class="text-xs text-gray-500 font-bold">THỜI GIAN</div>
                </div>
            </div>

            <div class="progress-bar mb-6">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>

            <div class="mb-6">
                <div class="flex items-center gap-2 mb-2">
                    <span id="question-index" class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-bold">Câu 1/20</span>
                    <span id="question-level" class="text-xs font-semibold px-2 py-1 rounded bg-gray-100 text-gray-600 border border-gray-200">Mức độ</span>
                </div>
                <h2 id="question-text" class="text-xl font-bold text-gray-800 leading-tight">Đang tải câu hỏi...</h2>
            </div>

            <div id="answer-options" class="space-y-3">
            </div>
        </div>

        <!-- Screen: Result -->
        <div id="screen-result" class="glass-card p-8 text-center hidden fade-in">
            <div class="text-6xl mb-4">🎊</div>
            <h2 class="text-3xl font-extrabold text-green-600 mb-2">HOÀN THÀNH THỬ THÁCH!</h2>
            <p id="result-message" class="text-lg text-gray-700 mb-6 font-semibold">Chúc mừng em: <span id="res-name" class="text-blue-600"></span></p>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <div class="text-sm text-gray-500 font-bold">ĐIỂM SỐ</div>
                    <div id="res-score" class="text-4xl font-bold text-blue-600">0.0</div>
                    <div class="text-xs text-gray-400 mt-1">trên 10 điểm</div>
                </div>
                <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                    <div class="text-sm text-gray-500 font-bold">THỜI GIAN</div>
                    <div id="res-time" class="text-4xl font-bold text-green-600">00:00</div>
                    <div class="text-xs text-gray-400 mt-1">tổng thời gian</div>
                </div>
            </div>

            <button onclick="location.reload()" class="bg-blue-500 text-white px-8 py-3 rounded-xl font-bold btn-hover">
                LÀM LẠI VÁN MỚI 🔄
            </button>
        </div>

    </div>

    <script>

            { q: "Bài toán nào bắt buộc phải dùng rẽ nhánh?", a: ["Tìm số lớn hơn trong 2 số", "Tính tổng n số", "In một dòng chữ", "Nhập họ tên"], c: 0, lv: "Vận dụng" },
            { q: "Bài toán “in bảng cửu chương 2” nên dùng cấu trúc nào?", a: ["Lặp", "Tuần tự", "Rẽ nhánh", "Không cần"], c: 0, lv: "Vận dụng" },
            { q: "Khi cần người dùng nhập lại cho đến khi đúng số dương, ta dùng:", a: ["Vòng lặp có điều kiện", "Cấu trúc tuần tự", "Câu lệnh If", "In ra màn hình"], c: 0, lv: "Vận dụng" },
            { q: "Nếu vòng lặp không có điều kiện dừng (điều kiện luôn đúng) thì:", a: ["Chương trình bị treo (lặp vô hạn)", "Dừng đúng lúc", "Chạy nhanh hơn", "Không chạy"], c: 0, lv: "Vận dụng" },
            { q: "Bài toán “tính tổng các số từ 1 đến n” cần dùng:", a: ["Cấu trúc lặp", "Tuần tự", "Rẽ nhánh", "Không cần"], c: 0, lv: "Vận dụng" },
            { q: "Bài toán “nhập n, nếu n > 0 thì tính tổng 1..n” cần kết hợp:", a: ["Rẽ nhánh + Lặp", "Tuần tự", "Chỉ lặp", "Không cần"], c: 0, lv: "Vận dụng" },
            { q: "Bài toán “in các số lẻ từ 1 đến 100” sử dụng:", a: ["Lặp + Rẽ nhánh (kiểm tra lẻ)", "Tuần tự", "Chỉ rẽ nhánh", "Không cần"], c: 0, lv: "Vận dụng" },
            { q: "Khi giải bài toán quản lý thư viện, ta thường:", a: ["Kết hợp nhiều cấu trúc (tuần tự, rẽ nhánh, lặp)", "Chỉ dùng 1 cấu trúc duy nhất", "Không cần thuật toán", "Chỉ dùng lặp"], c: 0, lv: "Vận dụng" },
            { q: "Thuật toán “Nhập số n → n chia hết cho 2? → Kết luận” là:", a: ["Tuần tự kết hợp rẽ nhánh", "Tuần tự kết hợp lặp", "Chỉ lặp", "Chỉ tuần tự"], c: 0, lv: "Vận dụng" }
        ];

        let currentQuestionSet = [];
        let currentIndex = 0;
        let score = 0;
        let startTime, timerInterval;
        let playerName = "";

        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        const icons = ['⭐', '✨', '💖', '❄️', '🍀', '🍎'];
        function createParticles() {
            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.fontSize = (Math.random() * 20 + 10) + 'px';
                p.style.opacity = Math.random() * 0.5 + 0.2;
                p.innerText = icons[Math.floor(Math.random() * icons.length)];
                p.style.animationDuration = (Math.random() * 3 + 5) + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 8000);
            }, 700);
        }

        createParticles();

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) {
                alert("Em hãy nhập họ tên để máy ghi nhận kết quả nhé!");
                return;
            }
            playerName = nameInput;
            
            const bg = document.getElementById('bgMusic');
            bg.volume = 0.25; 
            bg.play().catch(() => {});

            prepareQuestionSet();
            
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('display-name').innerText = playerName;
            
            currentIndex = 0;
            score = 0;
            startTime = Date.now();
            startTimer();
            showQuestion();
        }

        function prepareQuestionSet() {
            const nb = questionBank.filter(q => q.lv === "Nhận biết");
            const th = questionBank.filter(q => q.lv === "Thông hiểu");
            const vd = questionBank.filter(q => q.lv === "Vận dụng");
            
            // Trộn ngẫu nhiên và lấy đúng tỉ lệ
            const selectedNB = shuffle(nb).slice(0, 7);
            const selectedTH = shuffle(th).slice(0, 7);
            const selectedVD = shuffle(vd).slice(0, 6);
            
            // Gom lại và trộn thứ tự câu hỏi chính
            currentQuestionSet = shuffle([...selectedNB, ...selectedTH, ...selectedVD]);
        }

        function showQuestion() {
            const qData = currentQuestionSet[currentIndex];
            document.getElementById('question-index').innerText = `Câu ${currentIndex + 1}/20`;
            document.getElementById('question-level').innerText = qData.lv;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('progress-fill').style.width = `${(currentIndex / 20) * 100}%`;

            const optionsContainer = document.getElementById('answer-options');
            optionsContainer.innerHTML = '';

            // Map đáp án gốc và trộn chúng
            const answers = qData.a.map((text, idx) => ({ text, isCorrect: idx === qData.c }));
            const shuffledAnswers = shuffle(answers);

            shuffledAnswers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn font-semibold text-gray-700 bg-white shadow-sm';
                btn.innerText = ans.text;
                btn.onclick = () => handleAnswer(ans.isCorrect, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, btn) {
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                score += 0.5;
                btn.classList.add('bg-green-500', 'text-white', 'border-green-500');
                document.getElementById('correctSound').currentTime = 0;
                document.getElementById('correctSound').volume = 0.3;
                document.getElementById('correctSound').play();
            } else {
                btn.classList.add('bg-red-500', 'text-white', 'border-red-500');
                document.getElementById('wrongSound').currentTime = 0;
                document.getElementById('wrongSound').volume = 0.2;
                document.getElementById('wrongSound').play();
                
                // Hiển thị đáp án đúng sau khi chọn sai
                const btnsArr = Array.from(btns);
                const qData = currentQuestionSet[currentIndex];
                const correctText = qData.a[qData.c];
                btnsArr.forEach(b => {
                    if (b.innerText === correctText) {
                        b.classList.add('border-green-500', 'border-2', 'bg-green-50');
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < 20) {
                    showQuestion();
                } else {
                    endGame();
                }
            }, 1000);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const s = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('res-name').innerText = playerName;
            document.getElementById('res-score').innerText = score.toFixed(1);
            document.getElementById('res-time').innerText = document.getElementById('timer').innerText;
            
            const bg = document.getElementById('bgMusic');
            let vol = bg.volume;
            const fade = setInterval(() => {
                if (vol > 0.01) {
                    vol -= 0.02;
                    bg.volume = Math.max(0, vol);
                } else {
                    bg.pause();
                    clearInterval(fade);
                }
            }, 150);
        }
    </script>
</body>
</html>
